name: Build VeilGram for iPhone

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
      - name: Prepare Bazel's restricted tool path
        run: |
          command -v ccache >/dev/null || brew install ccache
          sudo mkdir -p /usr/local/bin
          if ! env PATH=/bin:/usr/bin:/usr/local/bin ccache --version >/dev/null 2>&1; then
            sudo ln -s "$(command -v ccache)" /usr/local/bin/ccache
          fi
          if ! env PATH=/bin:/usr/bin:/usr/local/bin sysctl -n hw.ncpu >/dev/null 2>&1; then
            sudo ln -s /usr/sbin/sysctl /usr/local/bin/sysctl
          fi
      - name: Check VeilGram exchange packets
        run: |
          mkdir -p .build/iphoneos
          swiftc -frontend -parse ios/*.swift
          swiftc -emit-module -parse-as-library -module-name TelegramCore ios/VeilGramGiftLink.swift -o .build/TelegramCore.swiftmodule
          swiftc -emit-object -parse-as-library -module-name TelegramCore ios/VeilGramGiftLink.swift -o .build/VeilGramGiftLink.o
          swiftc -I .build .build/VeilGramGiftLink.o ios/PolusProfileService.swift scripts/check_profile_packets.swift -o .build/check-profile-packets
          .build/check-profile-packets
          swiftc ios/PolusGIF.swift scripts/check_banner_gif.swift -o .build/check-banner-gif
          .build/check-banner-gif
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -emit-module -parse-as-library -module-name TelegramCore -target arm64-apple-ios15.0 \
            -sdk "$sdk" ios/VeilGramGiftLink.swift -o .build/iphoneos/TelegramCore.swiftmodule
          xcrun --sdk iphoneos swiftc -typecheck -warnings-as-errors -target arm64-apple-ios15.0 \
            -sdk "$sdk" -I .build/iphoneos ios/PolusProfileService.swift ios/PolusGIF.swift ios/PolusAvatarFrame.swift ios/PolusHostedProfiles.swift scripts/check_profile_packets.swift
      - name: Compile and package for sideloading
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          POLUS_BUNDLE_ID: ${{ vars.POLUS_BUNDLE_ID || 'org.polus.messenger' }}
          VEILGRAM_HOSTED_URL: ${{ vars.VEILGRAM_HOSTED_URL }}
          VEILGRAM_CERTIFICATE_SHA256: ${{ vars.VEILGRAM_CERTIFICATE_SHA256 }}
        run: python3 -u scripts/build_ios.py ipa --build-number "$((100000 + GITHUB_RUN_NUMBER))"
      - name: Upload IPA
        id: upload_ipa
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: VeilGram-unsigned
          path: out/VeilGram-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Save IPA to a draft release if artifact upload fails
        if: steps.upload_ipa.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_url="$(gh release create "ipa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            out/VeilGram-unsigned.ipa --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "VeilGram iPhone build #${GITHUB_RUN_NUMBER}" \
            --notes "IPA from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          printf '[Download the IPA from the draft release](%s)\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
